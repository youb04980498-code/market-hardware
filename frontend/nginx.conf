server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 add_header Cache-Control no-store always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 location = /frontend-health { access_log off; return 200 'ok'; }
 location /assets/ { try_files $uri =404; expires 1y; }
 location ~ ^/(api|graphql|internal)(/|$) { return 404; }
 location / { try_files $uri $uri/ /index.html; }
}
