groups:
  - name: market
    rules:
      - alert: ServiceUnavailable
        expr: up == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: 'Service indisponible'}
      - alert: ElevatedHttpErrors
        expr: sum by(service)(rate(market_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum by(service)(rate(market_http_requests_total[5m])), 0.01) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Plus de 5% erreurs HTTP'}
      - alert: ExcessiveLatency
        expr: histogram_quantile(0.95,sum by(le,service)(rate(market_http_duration_seconds_bucket[5m]))) > 2
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Latence p95 > 2 secondes'}
      - alert: KafkaLag
        expr: market_kafka_lag > 100
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Retard Kafka > 100 messages'}
      - alert: AnalyticsStale
        expr: market_analytics_freshness_seconds > 180
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 'Projection analytique ancienne'}
      - alert: PipelineFailure
        expr: market_pipeline_healthy == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: 'Pipeline en erreur ou reconciliation indisponible'}
      - alert: SparkProcessingStalled
        expr: market_kafka_lag > 0 and market_spark_input_rows_per_second == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Retard Kafka avec absence de traitement Spark'}
      - alert: ReconciliationFailure
        expr: market_reconciliation_healthy == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: 'La projection publiee ne se reconcilie pas'}
