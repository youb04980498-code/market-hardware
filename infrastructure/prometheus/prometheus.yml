global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: commerce
    static_configs:
      - targets: ['auth:8080','orders:8080','inventory:8080','payments:8080','catalog-graphql:8080','analytics:8080']
  - job_name: traefik
    static_configs:
      - targets: ['traefik:8082']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']
  - job_name: mongodb
    static_configs:
      - targets: ['mongodb-exporter:9216']
