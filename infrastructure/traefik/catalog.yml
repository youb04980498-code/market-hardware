http:
  routers:
    analytics:
      rule: PathPrefix(`/api/analytics`)
      entryPoints: [web]
      service: analytics
      middlewares: [catalog-limit, gateway-rate]
    frontend:
      rule: PathPrefix(`/`) && !PathPrefix(`/api`) && !PathPrefix(`/graphql`) && !PathPrefix(`/internal`) && !PathPrefix(`/health`)
      priority: 1
      entryPoints: [web]
      service: frontend
    payments:
      rule: PathPrefix(`/api/payments`)
      entryPoints: [web]
      service: payments
      middlewares: [catalog-limit, gateway-rate]
    orders:
      rule: PathPrefix(`/api/orders`)
      entryPoints: [web]
      service: orders
      middlewares: [catalog-limit, gateway-rate]
    inventory:
      rule: PathPrefix(`/api/inventory`)
      entryPoints: [web]
      service: inventory
      middlewares: [catalog-limit, gateway-rate]
    auth:
      rule: PathPrefix(`/api/auth`)
      entryPoints: [web]
      service: auth
      middlewares: [catalog-limit, gateway-rate]
    catalogue:
      rule: PathPrefix(`/graphql`)
      entryPoints: [web]
      service: catalogue
      middlewares: [catalog-limit, gateway-rate]
    catalogue-health:
      rule: Path(`/health/catalog`)
      entryPoints: [web]
      service: catalogue
      middlewares: [health-path]
  services:
    analytics:
      loadBalancer:
        servers:
          - url: http://analytics:8080
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:8080
    payments:
      loadBalancer:
        servers:
          - url: http://payments:8080
    orders:
      loadBalancer:
        servers:
          - url: http://orders:8080
    inventory:
      loadBalancer:
        servers:
          - url: http://inventory:8080
    auth:
      loadBalancer:
        servers:
          - url: http://auth:8080
    catalogue:
      loadBalancer:
        servers:
          - url: http://catalog-graphql:8080
  middlewares:
    gateway-rate:
      rateLimit:
        average: 100
        burst: 200
        period: 1s
    catalog-limit:
      buffering:
        maxRequestBodyBytes: 65536
    health-path:
      replacePath:
        path: /health
