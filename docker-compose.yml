name: market-hardware
include:
  - path: ./infrastructure/unopim/compose.yaml
    env_file: ./infrastructure/unopim/.env
x-commerce-env: &commerce-env
  PG_HOST: postgres
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  JWT_SECRET: ${JWT_SECRET}
  INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
  COMMERCE_TESTING: ${COMMERCE_TESTING:-0}
  AUTH_URL: http://auth:8080
  ORDERS_URL: http://orders:8080
  INVENTORY_URL: http://inventory:8080
  PAYMENTS_URL: http://payments:8080
x-commerce: &commerce
  image: market-hardware/commerce:phase4
  build:
    context: .
    dockerfile: infrastructure/compose/commerce.Dockerfile
  profiles: [commerce]
  restart: unless-stopped
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=10)"]
    interval: 15s
    timeout: 12s
    retries: 5
    start_period: 30s
services:
  analytics-worker:
    profiles: [analytics]
    image: market-hardware/analytics:phase6
    build:
      context: .
      dockerfile: pipelines/lakehouse/Dockerfile
    command: [python, -m, market_analytics.worker]
    environment:
      PG_HOST: postgres
      PG_ANALYTICS_READER_PASSWORD: ${PG_ANALYTICS_READER_PASSWORD:-}
      PG_ANALYTICS_WRITER_PASSWORD: ${PG_ANALYTICS_WRITER_PASSWORD:-}
      ANALYTICS_PSEUDONYM_KEY: ${ANALYTICS_PSEUDONYM_KEY:-}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      ANALYTICS_S3_ENDPOINT: http://minio:9000
      ANALYTICS_CATALOG_URL: http://catalog-graphql:8080/graphql
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      PYSPARK_SUBMIT_ARGS: --driver-memory 1g pyspark-shell
      ANALYTICS_TESTING: ${ANALYTICS_TESTING:-0}
      ANALYTICS_LOW_STOCK_THRESHOLD: ${ANALYTICS_LOW_STOCK_THRESHOLD:-5}
      WAREHOUSE_SATURATION_PERCENT: ${WAREHOUSE_SATURATION_PERCENT:-90}
      ORDER_SPIKE_MIN_COUNT: ${ORDER_SPIKE_MIN_COUNT:-10}
      ORDER_SPIKE_BASELINE_PER_5M: ${ORDER_SPIKE_BASELINE_PER_5M:-5}
      ORDER_SPIKE_FACTOR: ${ORDER_SPIKE_FACTOR:-3}
      ANALYTICS_REFRESH_SECONDS: ${ANALYTICS_REFRESH_SECONDS:-60}
    mem_limit: 2500m
    cpus: 2.0
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -m, market_analytics.cli, health]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 600s
  analytics:
    profiles: [analytics]
    image: market-hardware/analytics:phase6
    build:
      context: .
      dockerfile: pipelines/lakehouse/Dockerfile
    command: [uvicorn, market_analytics.api:app, --host, 0.0.0.0, --port, '8080']
    environment:
      PG_HOST: postgres
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PROMETHEUS_URL: http://prometheus:9090
      ALERTMANAGER_URL: http://alertmanager:9093
      PG_ANALYTICS_API_PASSWORD: ${PG_ANALYTICS_API_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_URL: http://auth:8080
      ANALYTICS_STALE_SECONDS: ${ANALYTICS_STALE_SECONDS:-180}
      ANALYTICS_LOW_STOCK_THRESHOLD: ${ANALYTICS_LOW_STOCK_THRESHOLD:-5}
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
  frontend:
    profiles: [frontend]
    image: market-hardware/frontend:phase5
    build:
      context: ./frontend
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/frontend-health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
  auth:
    <<: *commerce
    command: [uvicorn, market_commerce.auth:app, --host, 0.0.0.0, --port, '8080']
    environment:
      <<: *commerce-env
      PG_AUTH_PASSWORD: ${PG_AUTH_PASSWORD}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-0}
    depends_on:
      postgres:
        condition: service_healthy
  inventory:
    <<: *commerce
    command: [uvicorn, market_commerce.inventory:app, --host, 0.0.0.0, --port, '8080']
    environment:
      <<: *commerce-env
      PG_INVENTORY_PASSWORD: ${PG_INVENTORY_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
  payments:
    <<: *commerce
    command: [uvicorn, market_commerce.payments:app, --host, 0.0.0.0, --port, '8080']
    environment:
      <<: *commerce-env
      PG_PAYMENTS_PASSWORD: ${PG_PAYMENTS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
  orders:
    <<: *commerce
    command: [uvicorn, market_commerce.orders:app, --host, 0.0.0.0, --port, '8080']
    environment:
      <<: *commerce-env
      PG_ORDERS_PASSWORD: ${PG_ORDERS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payments:
        condition: service_healthy
      catalog-graphql:
        condition: service_healthy
  checkout-saga:
    <<: *commerce
    command: [python, -m, market_commerce.saga]
    environment:
      <<: *commerce-env
      PG_ORDERS_PASSWORD: ${PG_ORDERS_PASSWORD}
      COMMERCE_PROCESS: worker
    depends_on:
      orders:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; import time; assert time.time()-float(Path('/tmp/saga-heartbeat').read_text())<90"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  outbox-publisher:
    <<: *commerce
    command: [python, -m, market_commerce.outbox]
    environment:
      PG_HOST: postgres
      PG_OUTBOX_PASSWORD: ${PG_OUTBOX_PASSWORD}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-0}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      COMMERCE_TESTING: ${COMMERCE_TESTING:-0}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from market_commerce.common import connection;
          from datetime import datetime,UTC;
          c=connection('outbox');
          s=c.execute("SELECT checked_at FROM monitoring.worker_status WHERE worker_name='outbox'").fetchone();
          assert s and (datetime.now(UTC)-s['checked_at']).total_seconds()<90
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
  catalog-graphql:
    profiles: [catalog, commerce]
    image: market-hardware/catalog:phase3
    build:
      context: .
      dockerfile: services/catalog-graphql/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      MONGO_HOST: mongo
      MONGO_CATALOG_READ_USER: ${MONGO_CATALOG_READ_USER}
      MONGO_CATALOG_READ_PASSWORD: ${MONGO_CATALOG_READ_PASSWORD}
      NEO4J_HTTP_URL: http://neo4j:7474
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=10)"]
      interval: 15s
      timeout: 12s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  product-sync:
    profiles: [catalog]
    image: market-hardware/catalog:phase3
    build:
      context: .
      dockerfile: services/catalog-graphql/Dockerfile
    command: [python, -m, market_catalog.sync]
    environment:
      MONGO_HOST: mongo
      MONGO_CATALOG_SYNC_USER: ${MONGO_CATALOG_SYNC_USER}
      MONGO_CATALOG_SYNC_PASSWORD: ${MONGO_CATALOG_SYNC_PASSWORD}
      UNOPIM_URL: http://unopim
      UNOPIM_CLIENT_ID: ${UNOPIM_CLIENT_ID}
      UNOPIM_CLIENT_SECRET: ${UNOPIM_CLIENT_SECRET}
      UNOPIM_USERNAME: ${UNOPIM_USERNAME}
      UNOPIM_PASSWORD: ${UNOPIM_PASSWORD}
      NEO4J_HTTP_URL: http://neo4j:7474
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      catalog-graphql:
        condition: service_healthy
      unopim:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "from market_catalog.config import mongo; from datetime import datetime, UTC; s=mongo().market_catalog.sync_status.find_one({'_id':'worker'}); assert s and (datetime.now(UTC)-s['checked_at']).total_seconds()<120 and s['failures']==0"]
      interval: 30s
      timeout: 12s
      retries: 5
      start_period: 120s
    restart: unless-stopped
  traefik:
    profiles: [catalog, commerce]
    image: traefik:v3.5.0
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/catalog.yml
      - --ping=true
      - --accesslog=true
      - --accesslog.format=json
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infrastructure/traefik/catalog.yml:/etc/traefik/catalog.yml:ro
    depends_on:
      catalog-graphql:
        condition: service_healthy
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "printf 'RETURN 1;\\n' | cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka:
    profiles: [kafka, streaming]
    image: apache/kafka:4.1.2
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafkadata:/var/lib/kafka/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  minio:
    image: market-hardware/minio:RELEASE.2025-09-07T16-13-09Z
    build:
      context: ./infrastructure/minio
      dockerfile: Dockerfile
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=15d']
    profiles: [monitoring]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - promdata:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  log-retention:
    <<: *commerce
    command: [python, -m, market_commerce.log_retention]
    profiles: [monitoring]
    environment:
      PG_LOG_RETENTION_PASSWORD: ${PG_LOG_RETENTION_PASSWORD:-}
    healthcheck:
      disable: true
  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [monitoring]
    command: ['--config.file=/etc/alertmanager/alertmanager.yml','--storage.path=/alertmanager','--data.retention=120h']
    volumes:
      - ./infrastructure/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertdata:/alertmanager
    ports: ['127.0.0.1:9093:9093']
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    profiles: [monitoring]
    command: ['--config=/etc/otelcol/config.yml']
    volumes: ['./infrastructure/otel/collector.yml:/etc/otelcol/config.yml:ro']
    restart: unless-stopped
  jaeger-storage-init:
    image: postgres:16-alpine
    profiles: [monitoring]
    user: '0:0'
    entrypoint: [sh, -c, 'chown -R 10001:10001 /badger']
    volumes: [tracedata:/badger]
    restart: 'no'
  jaeger:
    image: jaegertracing/all-in-one:1.66.0
    command: ['--badger.span-store-ttl=72h']
    depends_on:
      jaeger-storage-init:
        condition: service_completed_successfully
    profiles: [monitoring]
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: 'false'
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes: [tracedata:/badger]
    ports: ['127.0.0.1:16686:16686']
    restart: unless-stopped
  mongodb-exporter:
    image: percona/mongodb_exporter:0.43.1
    profiles: [monitoring]
    environment:
      MONGODB_URI: ${MONGODB_MONITOR_URI:-}
    command: ['--collect-all']
    restart: unless-stopped
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    profiles: [monitoring]
    command: ['--kafka.server=kafka:19092']
    restart: unless-stopped
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [monitoring]
    environment:
      DATA_SOURCE_URI: postgres:5432/market_db?sslmode=disable
      DATA_SOURCE_USER: market_monitor
      DATA_SOURCE_PASS: ${PG_MONITOR_PASSWORD:-}
    restart: unless-stopped

volumes:
  neo4jdata:
    name: market-hardware_neo4jdata
  pgdata:
  mongodata:
  kafkadata:
  redisdata:
  miniodata:
  promdata:
  grafanadata:
  alertdata:
  tracedata:
